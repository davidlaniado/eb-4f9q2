<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)">
<title>Editor Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One column per editor, left to right, worst first. Each job = one short line + a late/due badge. Tap a line for the detail. */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#161a1d; --muted:#5f6871; --line:#dde1dc;
  --accent:#0f4c5c;
  --you:#b3261e; --you-soft:#fbe4e1;
  --them:#8a5a00; --them-soft:#fdf0d2;
  --live:#1d6b3a; --live-soft:#dcefdf;
  --off:#6b7280; --off-soft:#e8eaed;
  --late:#b3261e; --late-ink:#fff;
  --colw:300px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121517; --card:#1b1f23; --fg:#eceef0; --muted:#9aa3ab; --line:#2b3136;
  --accent:#7fc4d2;
  --you:#ff8a80; --you-soft:#4a1c19;
  --them:#f0c060; --them-soft:#3f2f0c;
  --live:#7fd49a; --live-soft:#153821;
  --off:#a0a7ae; --off-soft:#2a2f34;
  --late:#ff6b60; --late-ink:#1b0a09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121517; --card:#1b1f23; --fg:#eceef0; --muted:#9aa3ab; --line:#2b3136;
  --accent:#7fc4d2;
  --you:#ff8a80; --you-soft:#4a1c19;
  --them:#f0c060; --them-soft:#3f2f0c;
  --live:#7fd49a; --live-soft:#153821;
  --off:#a0a7ae; --off-soft:#2a2f34;
  --late:#ff6b60; --late-ink:#1b0a09; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.4;
  padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:40px}
a{color:var(--accent)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
.sum{font-size:13px;color:var(--muted)}
.sum b{color:var(--you);font-weight:700}
.sum b.l{color:var(--late)}
.stamp{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
.stamp.stale{border-color:var(--them);color:var(--them)}
.stamp.old{border-color:var(--late);color:var(--late)}
.board{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;align-items:flex-start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:10px}
.col{flex:0 0 var(--colw);width:var(--colw);scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.col.has-late{border-color:var(--late)}
.colhead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.colhead .name{font-weight:700;font-size:16px;line-height:1.2}
.colhead .late{font-size:11px;font-weight:700;color:var(--late-ink);background:var(--late);padding:2px 7px;border-radius:6px;white-space:nowrap}
.grp h3{margin:0;padding:8px 12px 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;cursor:default}
.grp.you h3{color:var(--you)} .grp.them h3{color:var(--them)} .grp.live h3{color:var(--live);cursor:pointer}
.grp.live h3::after{content:"▸";font-size:12px} .grp.live.open h3::after{content:"▾"}
.grp.live .rows{display:none} .grp.live.open .rows{display:block}
.grp+.grp{border-top:1px solid var(--line)}
.row{padding:7px 12px 8px;cursor:pointer}
.row+.row{border-top:1px dashed var(--line)}
.row .l{display:flex;gap:8px;align-items:flex-start}
.row .dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--off)}
.grp.you .row .dot{background:var(--you)} .grp.them .row .dot{background:var(--them)} .grp.live .row .dot{background:var(--live)}
.row.off .dot{background:var(--off)}
.row .txt{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.grp.you .row .txt{font-weight:600}
.row .b{flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;margin-top:1px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.b.late{background:var(--late);color:var(--late-ink)}
.b.soon{background:var(--them-soft);color:var(--them);border:1px solid var(--them)}
.b.ok{background:var(--off-soft);color:var(--muted)}
.row .more{display:none;margin:6px 0 0 16px;font-size:13px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.row.open .more{display:block}
.row .more .need{color:var(--fg);background:var(--you-soft);border-radius:7px;padding:6px 8px;margin-bottom:5px}
.row .more b{color:var(--fg)}
.row .more code{font-family:var(--mono);font-size:11px;background:var(--off-soft);padding:1px 4px;border-radius:4px;word-break:break-all}
.row .more .meta{font-size:11.5px;margin-top:4px;font-family:var(--mono)}
.empty{padding:4px 12px 8px;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:12px;margin-top:6px}
.foot p{margin:3px 0}
.err{background:var(--you-soft);color:var(--you);padding:12px 14px;border-radius:10px}
@media (max-width:600px){:root{--colw:min(84vw,330px)}}
</style>
</head>
<body>
<header class="pad">
  <div><h1>Editor Board</h1><div class="sum" id="sum"></div></div>
  <button class="stamp" id="stamp" title="Tap to reload">loading…</button>
</header>
<div class="board" id="board"></div>
<div class="foot pad">
  <p>Swipe sideways for the next editor. Tap a line for the detail. Red = late.</p>
</div>

<script>
const MS = 86400000;
function pd(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const today = new Date(); today.setHours(0,0,0,0);
const dd = (a,b)=>Math.round((a-b)/MS);
const fmtD = d=>`${d.getMonth()+1}/${d.getDate()}`;
const esc = s=>String(s??'').replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;');

function dueInfo(j){
  const ref = j.ball==='you' ? j.follow_up : (j.ball==='them' ? j.due : null);
  if(!ref) return {cls:'', label:'', n:null};
  const n = dd(pd(ref), today);
  if(n<0)  return {cls:'late', label:`${-n}d late`, n};
  if(n===0) return {cls:'soon', label:'today', n};
  if(n===1) return {cls:'soon', label:'tomorrow', n};
  return {cls:'ok', label:fmtD(pd(ref)), n};
}
function urg(j){
  const d = dueInfo(j);
  if(d.cls==='late') return 100 + (-d.n) + (j.ball==='you'?50:0);
  if(d.cls==='soon') return 60 + (j.ball==='you'?10:0) - d.n;
  return {you:40, them:30, live:20, off:10}[j.ball] || 0;
}
let DATA=null;
function stampText(){
  const u = new Date(DATA.updated);
  const mins = Math.round((Date.now()-u)/60000);
  const ago = mins<60 ? `${mins}m ago` : mins<2880 ? `${Math.round(mins/60)}h ago` : `${Math.round(mins/1440)}d ago`;
  const el = document.getElementById('stamp');
  el.textContent = `Updated ${ago}`;
  el.title = u.toLocaleString();
  el.className = 'stamp' + (mins>1440 ? ' old' : mins>240 ? ' stale' : '');
}
function rowHTML(j, info){
  const day = j.started ? `day ${dd(today, pd(j.started))+1}` : '';
  return `<div class="row${j.ball==='off'?' off':''}" data-id="${j.id}">
    <div class="l"><span class="dot"></span><span class="txt">${esc(j.line||j.title)}</span>${info.label?`<span class="b ${info.cls}">${info.label}</span>`:''}</div>
    <div class="more">${j.ball==='you'&&j.need?`<div class="need">${j.need}</div>`:''}${j.status?`<div>${j.status}</div>`:''}<div class="meta">${esc(j.title)}${day?` · ${day}`:''}${j.due&&j.ball!=='them'?` · due ${fmtD(pd(j.due))}`:''}</div></div>
  </div>`;
}
function render(){
  const jobs = DATA.jobs.filter(j=>j.ball!=='done'), eds = DATA.editors;
  const infos = Object.fromEntries(jobs.map(j=>[j.id, dueInfo(j)]));
  const youN = jobs.filter(j=>j.ball==='you').length, lateN = jobs.filter(j=>infos[j.id].cls==='late').length;
  document.getElementById('sum').innerHTML = `<b>${youN} on you</b> · <b class="l">${lateN} late</b>`;
  const edScore = e=>Math.max(0,...jobs.filter(j=>j.editor===e.id).map(urg));
  const ordered = [...eds].sort((a,b)=>edScore(b)-edScore(a));
  document.getElementById('board').innerHTML = ordered.map(e=>{
    const js = jobs.filter(j=>j.editor===e.id).sort((a,b)=>urg(b)-urg(a));
    if(!js.length) return '';
    const you = js.filter(j=>j.ball==='you'), them = js.filter(j=>j.ball==='them'), rest = js.filter(j=>j.ball==='live'||j.ball==='off');
    const late = js.filter(j=>infos[j.id].cls==='late').length;
    const rows = arr=>arr.map(j=>rowHTML(j, infos[j.id])).join('');
    return `<section class="col${late?' has-late':''}" id="ed-${e.id}">
      <div class="colhead"><div class="name">${esc(e.name)}</div>${late?`<span class="late">${late} late</span>`:''}</div>
      <div class="grp you"><h3>You${you.length?` · ${you.length}`:''}</h3>${you.length?rows(you):'<div class="empty">nothing</div>'}</div>
      <div class="grp them"><h3>Them${them.length?` · ${them.length}`:''}</h3>${them.length?rows(them):'<div class="empty">nothing</div>'}</div>
      ${rest.length?`<div class="grp live"><h3>Live · ${rest.length}</h3><div class="rows">${rows(rest)}</div></div>`:''}
    </section>`;
  }).join('');
}
document.getElementById('board').addEventListener('click', e=>{
  if(e.target.closest('a')) return;
  const h = e.target.closest('.grp.live h3'); if(h){ h.parentElement.classList.toggle('open'); return; }
  const r = e.target.closest('.row'); if(r) r.classList.toggle('open');
});
document.getElementById('stamp').addEventListener('click', ()=>location.reload());
fetch('data/jobs.json?t='+Date.now(), {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ DATA=d; stampText(); render(); setInterval(stampText, 60000); })
  .catch(err=>{ document.getElementById('stamp').textContent='data failed'; document.getElementById('board').innerHTML=`<div class="err pad">Could not load data/jobs.json (${esc(err.message)}). Reload.</div>`; });
</script>
</body>
</html>
